services:
  postgres:
    image: postgres:16-alpine
    container_name: springboot-employeehub-api
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: employeehub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"

  employeehub:
    image: employeehub:01
    container_name: employeehub-api
    depends_on:
      - postgres
      - rabbitmq
    ports:
      - "8080:8080"
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_SECONDS: ${ACCESS_TOKEN_SECONDS}
      REFRESH_TOKEN_SECONDS: ${REFRESH_TOKEN_SECONDS}
      TOKEN_ISSUER: ${TOKEN_ISSUER}
      # App
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_APP_BASE_URL: ${SPRING_APP_BASE_URL}
      # AWS S3
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_PRESIGN_EXPIRE_MINUTES: ${S3_PRESIGN_EXPIRE_MINUTES:-3}
      # Documents
      DOCUMENT_MAX_SIZE: ${DOCUMENT_MAX_SIZE:-10485760}
